<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumi – your AI assistant</title>
<meta name="description" content="Lumi is a friendly AI assistant. Ask anything, write faster and get ideas.">
<style>
:root{--bg:#faf9f7;--side:#f3f1ec;--surface:#ffffff;--text:#1f1e1d;--muted:#6b6963;--accent:#c96442;--accent-ink:#ffffff;--user:#efece6;--border:#e3e0d8;--code:#f3f1ec;--hover:#e9e6df;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--side:#242321;--surface:#262522;--text:#f1efe9;--muted:#a8a59d;--accent:#e07a55;--accent-ink:#1c1b19;--user:#34322e;--border:#3a3834;--code:#1f1e1c;--hover:#2f2d2a;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala","Iskoola Pota",sans-serif;display:flex;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.logo{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none}

/* sidebar */
#side{width:272px;flex:none;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sidehead{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.sidehead b{font-size:18px}
#newbtn{margin:6px 12px 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:500}
#newbtn:hover{border-color:var(--accent)}
.label{padding:6px 18px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.item{display:flex;align-items:center;border-radius:10px}
.item:hover,.item.active{background:var(--hover)}
.item .t{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 10px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .del{background:none;border:0;color:var(--muted);padding:6px 10px;font-size:18px;line-height:1;border-radius:8px}
.item .del:hover{color:var(--accent)}
.empty{padding:10px 12px;color:var(--muted);font-size:14px}
.sidefoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);border-top:1px solid var(--border)}

/* app */
#app{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
header .ttl{font-weight:600;flex:1}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 12px;display:flex;flex-direction:column;gap:18px}
#welcome{text-align:center;padding:9vh 0 0}
#welcome .logo{width:64px;height:64px;font-size:34px;margin:0 auto 18px}
#welcome h1{font-size:30px;line-height:1.2;margin:0 0 8px}
#welcome p{color:var(--muted);margin:0 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:11px 16px;font-size:15px;text-align:left;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:flex-start}
.row.user{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;margin-top:2px}
.bubble{max-width:calc(100% - 44px);overflow-wrap:anywhere}
.user .bubble{background:var(--user);padding:10px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;max-width:85%}
.bot .bubble{padding-top:3px}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:0 0 10px;padding-left:22px}
.bubble li{margin:3px 0}
.bubble h3{margin:12px 0 6px;font-size:17px}
.bubble code{background:var(--code);border:1px solid var(--border);border-radius:6px;padding:1px 5px;font:13.5px ui-monospace,Consolas,monospace}
.bubble pre{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:0 0 10px}
.bubble pre code{background:none;border:0;padding:0}
.tablebox{overflow-x:auto;margin:0 0 10px}
.bubble table{border-collapse:collapse;font-size:14.5px}
.bubble th,.bubble td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.bubble th{background:var(--code)}
.tools{margin-top:6px}
.tools button{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 0}
.tools button:hover{color:var(--accent)}
.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.errtxt{color:var(--muted);font-size:15px}
footer{padding:8px 18px calc(10px + env(safe-area-inset-bottom,0px))}
form{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
form:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;max-height:160px;padding:6px 0;line-height:1.5}
#send{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
#send:disabled{opacity:.4;cursor:default}
.note{max-width:760px;margin:6px auto 0;text-align:center;font-size:12px;color:var(--muted)}
#shade{display:none}

@media (max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;width:min(300px,84vw)}
  body.sideopen #side{transform:none}
  body.sideopen #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
  header{display:flex}
  #welcome h1{font-size:25px}
}
</style>
</head>
<body>
<aside id="side">
  <div class="sidehead"><div class="logo">L</div><b>Lumi</b></div>
  <button id="newbtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <div class="label">Chat history</div>
  <div id="list"></div>
  <div class="sidefoot">Chats are saved on this device only.</div>
</aside>
<div id="shade"></div>
<div id="app">
  <header>
    <button class="ibtn" id="menu" type="button" aria-label="Open chat history"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="ttl">Lumi</div>
    <button class="ibtn" id="newtop" type="button" aria-label="New chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <main id="main"><div class="wrap" id="log"></div></main>
  <footer>
    <form id="f">
      <textarea id="box" rows="1" placeholder="Message Lumi…" aria-label="Message Lumi"></textarea>
      <button id="send" type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
    </form>
    <div class="note">Lumi can make mistakes. Created by Binuk Jayasuriya.</div>
  </footer>
</div>
<script>
const $=id=>document.getElementById(id);
const log=$("log"),main=$("main"),box=$("box"),send=$("send"),f=$("f"),list=$("list");
const KEY="lumi_chats_v1";
let chats=[],cur=null,busy=false;

/* ---------- storage ---------- */
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"[]");chats=Array.isArray(d)?d:[]}catch(e){chats=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats.filter(c=>c.messages.length)))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- markdown-lite renderer (safe: escapes HTML first) ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  return s;
}
function render(text){
  const lines=text.replace(/\r/g,"").split("\n");
  let out="",i=0,lst=null;
  function closeList(){if(lst){out+="</"+lst+">";lst=null}}
  while(i<lines.length){
    const ln=lines[i];
    if(/^```/.test(ln)){
      closeList();let code=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){code.push(lines[i]);i++}
      i++;out+="<pre><code>"+esc(code.join("\n"))+"</code></pre>";continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<lines.length&&/^\s*\|?[\s:\-|]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes("-")){
      closeList();
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      let t="<div class='tablebox'><table><thead><tr>"+cells(ln).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
      i+=2;
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t+="<tr>"+cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";i++}
      out+=t+"</tbody></table></div>";continue;
    }
    let m;
    if((m=ln.match(/^\s*#{1,6}\s+(.*)$/))){closeList();out+="<h3>"+inline(m[1])+"</h3>";i++;continue}
    if((m=ln.match(/^\s*[-*•]\s+(.*)$/))){if(lst!=="ul"){closeList();out+="<ul>";lst="ul"}out+="<li>"+inline(m[1])+"</li>";i++;continue}
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){if(lst!=="ol"){closeList();out+="<ol>";lst="ol"}out+="<li>"+inline(m[1])+"</li>";i++;continue}
    if(ln.trim()===""){closeList();i++;continue}
    closeList();
    let para=[ln];i++;
    while(i<lines.length&&lines[i].trim()!==""&&!/^(```|\s*#{1,6}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])){para.push(lines[i]);i++}
    out+="<p>"+para.map(inline).join("<br>")+"</p>";
  }
  closeList();return out;
}

/* ---------- message UI ---------- */
function scrollDown(){main.scrollTop=main.scrollHeight}
function addUser(t){const r=document.createElement("div");r.className="row user";const b=document.createElement("div");b.className="bubble";b.textContent=t;r.appendChild(b);log.appendChild(r);scrollDown()}
function addBot(){
  const r=document.createElement("div");r.className="row bot";
  const av=document.createElement("div");av.className="av";av.textContent="L";
  const b=document.createElement("div");b.className="bubble";
  b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  r.appendChild(av);r.appendChild(b);log.appendChild(r);scrollDown();return b;
}
function fillBot(b,text){
  b.innerHTML=render(text);
  const t=document.createElement("div");t.className="tools";
  const c=document.createElement("button");c.type="button";c.textContent="Copy";
  c.onclick=async()=>{try{await navigator.clipboard.writeText(text);c.textContent="Copied";setTimeout(()=>c.textContent="Copy",1500)}catch(e){}};
  t.appendChild(c);b.appendChild(t);
}
function welcome(){
  const d=document.createElement("div");d.id="welcome";
  d.innerHTML='<div class="logo">L</div><h1>Hi, I’m Lumi</h1><p>Ask me anything, or try one of these.</p><div class="chips"></div>';
  ["Explain how the internet works in simple words","Write a friendly email asking for a day off","Give me 5 ideas for a YouTube channel","Help me plan a healthy weekly meal plan"].forEach(t=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t;d.querySelector(".chips").appendChild(b);
  });
  return d;
}
function showChat(){
  log.innerHTML="";
  if(!cur.messages.length){log.appendChild(welcome());return}
  cur.messages.forEach(m=>{if(m.role==="user")addUser(m.content);else fillBot(addBot(),m.content)});
  scrollDown();
}

/* ---------- history sidebar ---------- */
function showList(){
  list.innerHTML="";
  const items=chats.filter(c=>c.messages.length).sort((a,b)=>b.updated-a.updated);
  if(!items.length){const e=document.createElement("div");e.className="empty";e.textContent="No chats yet. Your conversations will appear here.";list.appendChild(e);return}
  items.forEach(c=>{
    const row=document.createElement("div");row.className="item"+(cur&&c.id===cur.id?" active":"");
    const t=document.createElement("button");t.type="button";t.className="t";t.textContent=c.title;t.title=c.title;t.onclick=()=>openChat(c.id);
    const d=document.createElement("button");d.type="button";d.className="del";d.textContent="×";d.title="Delete chat";d.setAttribute("aria-label","Delete chat");
    d.onclick=e=>{e.stopPropagation();removeChat(c.id)};
    row.appendChild(t);row.appendChild(d);list.appendChild(row);
  });
}
function closeSide(){document.body.classList.remove("sideopen")}
function newChat(){
  if(cur&&!cur.messages.length){showChat();showList();closeSide();box.focus();return}
  cur={id:uid(),title:"New chat",messages:[],updated:Date.now()};
  chats.unshift(cur);showChat();showList();closeSide();box.focus();
}
function openChat(id){
  if(busy)return;
  const c=chats.find(x=>x.id===id);if(!c)return;
  chats=chats.filter(x=>x.messages.length||x===c);
  cur=c;showChat();showList();closeSide();
}
function removeChat(id){
  if(busy)return;
  if(!confirm("Delete this chat?"))return;
  chats=chats.filter(c=>c.id!==id);save();
  if(cur&&cur.id===id){cur=null;newChat()}else showList();
}

/* ---------- asking ---------- */
async function ask(q){
  if(!q||busy)return;
  const chat=cur;
  const w=$("welcome");if(w)w.remove();
  chat.messages.push({role:"user",content:q});
  if(chat.messages.length===1)chat.title=q.length>42?q.slice(0,42)+"…":q;
  chat.updated=Date.now();save();showList();
  addUser(q);box.value="";box.style.height="auto";
  const b=addBot();busy=true;send.disabled=true;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chat.messages.map(m=>({role:m.role,content:m.content}))})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Error");
    chat.messages.push({role:"assistant",content:d.reply});chat.updated=Date.now();save();
    fillBot(b,d.reply);
  }catch(err){
    console.error(err);
    b.innerHTML='<span class="errtxt">Sorry, I couldn’t answer just now. Please try again in a moment.</span>';
  }
  busy=false;send.disabled=false;showList();scrollDown();box.focus();
}

/* ---------- events ---------- */
f.addEventListener("submit",e=>{e.preventDefault();ask(box.value.trim())});
box.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();f.requestSubmit()}});
box.addEventListener("input",()=>{box.style.height="auto";box.style.height=Math.min(box.scrollHeight,160)+"px"});
log.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c)ask(c.textContent)});
$("newbtn").addEventListener("click",()=>{if(!busy)newChat()});
$("newtop").addEventListener("click",()=>{if(!busy)newChat()});
$("menu").addEventListener("click",()=>document.body.classList.add("sideopen"));
$("shade").addEventListener("click",closeSide);

load();newChat();
</script>
</body>
</html>
