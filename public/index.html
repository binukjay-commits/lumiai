<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi</title>
<style>
:root{--bg:#faf9f7;--surface:#fff;--text:#1f1e1d;--muted:#6b6963;--accent:#c96442;--user:#efece6;--border:#e3e0d8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--surface:#262522;--text:#f1efe9;--muted:#a09d95;--user:#33312d;--border:#3a3834;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--user)}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
.err{color:var(--muted);font-size:14px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
textarea{flex:1;resize:none;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;background:var(--accent);color:#fff;padding:8px 18px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>Lumi</header>
<div id="log"><div class="msg bot">Hi, I’m Lumi! Ask me anything.</div></div>
<form id="f"><textarea id="box" rows="1" placeholder="Type your message…"></textarea><button id="send">Send</button></form>
<script>
const log=document.getElementById("log"),box=document.getElementById("box"),send=document.getElementById("send"),f=document.getElementById("f");
let chatHistory=[];
function add(cls,t){const d=document.createElement("div");d.className="msg "+cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
box.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();f.requestSubmit()}});
f.addEventListener("submit",async e=>{
  e.preventDefault();const q=box.value.trim();if(!q)return;
  box.value="";add("user",q);chatHistory.push({role:"user",content:q});
  const b=add("bot","Thinking…");send.disabled=true;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chatHistory})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Error");
    b.textContent=d.reply;chatHistory.push({role:"assistant",content:d.reply});
  }catch(err){b.className="msg bot err";b.textContent="Error: "+err.message;chatHistory.pop()}
  send.disabled=false;box.focus();
});
</script>
</body>
</html>
